plugins { id "com.android.application" }

android {
    namespace "com.okonu.flipflix"
    compileSdk 35
    defaultConfig {
        applicationId "com.okonu.flipflix"
        minSdk 22
        targetSdk 33
        versionCode 19
        versionName "0.1.18"
        manifestPlaceholders = [appLabel: "Flipflix"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug {
            // Physical-TV regression tests must not touch the viewer's real app data.
            if (project.hasProperty("isolatedTvTest")) {
                applicationIdSuffix ".validation"
                manifestPlaceholders = [appLabel: "Flipflix Test"]
            }
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}

dependencies {
    // Keep Android 5.1 / Fire OS 5 support (newer releases raise the minimum SDK).
    implementation "androidx.media3:media3-exoplayer:1.5.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.5.1"
    implementation "androidx.media3:media3-ui:1.5.1"
    implementation "androidx.webkit:webkit:1.12.1"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test:rules:1.6.1"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
}
