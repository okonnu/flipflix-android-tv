plugins { id "com.android.application" }

android {
    namespace "com.okonu.flipflix"
    compileSdk 35
    defaultConfig {
        applicationId "com.okonu.flipflix"
        minSdk 22
        targetSdk 33
        versionCode 1
        versionName "0.1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}
