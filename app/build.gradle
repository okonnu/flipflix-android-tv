plugins { id "com.android.application" }

android {
    namespace "com.okonu.flipflix"
    compileSdk 35
    defaultConfig {
        applicationId "com.okonu.flipflix"
        minSdk 22
        targetSdk 33
        versionCode 24
        versionName "0.1.23"
        manifestPlaceholders = [appLabel: "Dagflix"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug {
            // Physical-TV regression tests must not touch the viewer's real app data.
            if (project.hasProperty("isolatedTvTest")) {
                applicationIdSuffix ".validation"
                manifestPlaceholders = [appLabel: "Dagflix Test"]
            }
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
    // Generated, signed future-version fixture. Never packaged in the release app.
    sourceSets.androidTest.assets.srcDir(layout.buildDirectory.dir("update-test-assets"))
}

androidComponents {
    onVariants(selector().withBuildType("debug")) { variant ->
        if (project.hasProperty("isolatedTvTest") && project.hasProperty("updateTestCandidate")) {
            variant.outputs.each { output ->
                output.versionCode.set(25)
                output.versionName.set("0.1.24")
            }
        }
    }
}

dependencies {
    // Keep Android 5.1 / Fire OS 5 support (newer releases raise the minimum SDK).
    implementation "androidx.media3:media3-exoplayer:1.5.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.5.1"
    implementation "androidx.media3:media3-ui:1.5.1"
    implementation "androidx.webkit:webkit:1.12.1"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test:rules:1.6.1"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
}
